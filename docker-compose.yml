services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5433:5432"
    healthcheck:
      # TCP, not the socket: the image's temporary init server listens on the
      # socket only, so this passes only once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U iris -d iris"]
      interval: 2s
      timeout: 3s
      retries: 30
