[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-pilot"
version = "0.1.0"
description = "Project IRIS one-command pilot orchestration (IRIS-CAND-22)"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iris-pilot = "iris_pilot.cli:main"

[tool.setuptools]
packages = ["iris_pilot"]

[tool.setuptools.package-data]
iris_pilot = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL/PostGIS server (IRIS_TEST_ADMIN_URL)"]
